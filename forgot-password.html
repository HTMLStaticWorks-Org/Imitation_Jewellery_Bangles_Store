<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Lustre Lane imitation jewellery and bangles boutique">
  <title>Forgot password | Lustre Lane</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <script defer src="assets/app.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-nav">
      <a href="index.html" class="auth-back-link">← Back to store</a>
      <div class="navtools">
        <button class="iconbtn" onclick="toggleRTL()" data-rtl-label>RTL</button>
        <button class="iconbtn" onclick="toggleTheme()" aria-label="Toggle theme" data-theme-icon>☾</button>
      </div>
    </div>

    <div class="auth-center">
      <div class="auth-brand-logo">
        <a class="logo" href="index.html">
          <img src="assets/favicon.svg" alt="Lustre Lane logo" class="brandlogo">Lustre <span>Lane.</span>
        </a>
      </div>

      <div class="formwrap" style="margin:0 auto;">
        <span class="eyebrow" style="margin-bottom:8px;">Account recovery</span>
        <h2>Forgot your password?</h2>
        <p style="color:var(--muted);font-size:14px;line-height:1.6;margin-top:0;margin-bottom:18px;">Enter your registered email address and we'll send you instructions to reset your password.</p>
        <form data-demo>
          <div class="field">
            <label>Email address</label>
            <input type="email" required placeholder="you@example.com">
          </div>
          <button class="btn">Send reset link</button>
          <div class="notice"></div>
        </form>
        <div class="formnote"><a href="login.html">← Back to sign in</a></div>
      </div>
    </div>

    <div class="auth-footer">
      © 2026 Lustre Lane. Demo storefront template.
    </div>
  </div>
</body>
</html>
