<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Lustre Lane imitation jewellery and bangles boutique">
  <title>Reset password | Lustre Lane</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <script defer src="assets/app.js"></script>
</head>
<body>
  <!-- Theme & RTL in Top Right in All Devices (Point 16) -->
  <div class="auth-top-tools">
    <button class="iconbtn" onclick="toggleRTL()" data-rtl-label>RTL</button>
    <button class="iconbtn" onclick="toggleTheme()" aria-label="Toggle theme" data-theme-icon>☾</button>
  </div>

  <div class="auth-page">
    <div class="auth-card-container">
      <div class="auth-card">
        <!-- Brand Name & Logo Inside the Card (Point 16) -->
        <div class="auth-card-brand">
          <a class="logo" href="index.html">
            <img src="assets/favicon.svg" alt="Lustre Lane logo" class="brandlogo">Lustre <span>Lane.</span>
          </a>
        </div>

        <!-- Heading centered (Point 18) -->
        <div class="auth-card-head">
          <span class="eyebrow">New credentials</span>
          <h2>Choose a new password</h2>
          <p>Create a strong, secure new password for your Lustre Lane account.</p>
        </div>

        <form data-demo>
          <div class="field">
            <label>New password</label>
            <div class="passwordbox">
              <input type="password" required minlength="6" placeholder="Enter new password (min 6 characters)">
              <button type="button" class="eye" aria-label="Show password">◉</button>
            </div>
          </div>
          <div class="field">
            <label>Confirm new password</label>
            <div class="passwordbox">
              <input type="password" required minlength="6" placeholder="Re-enter new password">
              <button type="button" class="eye" aria-label="Show password">◉</button>
            </div>
          </div>
          <button class="btn">Update password →</button>
          <div class="notice"></div>
        </form>
        <div class="auth-footer-note"><a class="textlink" href="login.html">← Return to sign in</a></div>
      </div>
    </div>
  </div>
</body>
</html>
