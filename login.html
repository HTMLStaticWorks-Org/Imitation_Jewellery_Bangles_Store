<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Lustre Lane imitation jewellery and bangles boutique">
  <title>Login | Lustre Lane</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <script defer src="assets/app.js"></script>
</head>
<body>
  <!-- Theme & RTL in Top Right in All Devices (Point 16) -->
  <div class="auth-top-tools">
    <button class="iconbtn" onclick="toggleRTL()" data-rtl-label>RTL</button>
    <button class="iconbtn" onclick="toggleTheme()" aria-label="Toggle theme" data-theme-icon>☾</button>
  </div>

  <div class="auth-page">
    <div class="auth-card-container">
      <div class="auth-card">
        <!-- Brand Name & Logo Inside the Card (Point 16) -->
        <div class="auth-card-brand">
          <a class="logo" href="index.html">
            <img src="assets/favicon.svg" alt="Lustre Lane logo" class="brandlogo">Lustre <span>Lane.</span>
          </a>
        </div>

        <!-- Heading centered (Point 18) -->
        <div class="auth-card-head">
          <span class="eyebrow">Welcome back</span>
          <h2>Sign in to your account</h2>
          <p>Access your saved favourites, bridal curations and order tracking.</p>
        </div>

        <!-- Social Media Buttons Inside Card (Point 17) -->
        <div class="social-auth-wrap">
          <div class="social-auth-buttons">
            <button type="button" class="social-login-btn">
              <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 14.5s.7 4.8 1.9 7.2l3.7-2.9z"/><path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16.5C3.7 20.2 7.5 23.5 12 23.5z"/></svg>
              <span>Google</span>
            </button>
            <button type="button" class="social-login-btn">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.7 19.5c-.8 1.2-1.7 2.4-3 2.5-1.3.1-1.8-.8-3.3-.8s-2 .8-3.3.8c-1.3-.1-2.2-1.2-3.1-2.5-1.7-2.5-3-7-1.3-10 1-.8 2.2-1.3 3.5-1.3 1.3 0 2.2.8 3.1.8.8 0 2-.8 3.5-.8 1.4 0 2.7.7 3.5 1.7-3.1 1.7-2.6 6.1.5 7.3-.6 1.6-1.4 3.2-2.4 4.5zM15.4 6.7c.6-.8 1-1.8.9-2.7-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.7-.9 2.6 1 .1 2-.5 2.6-1.3z"/></svg>
              <span>Apple</span>
            </button>
            <button type="button" class="social-login-btn">
              <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.1C24 5.4 18.6 0 12 0S0 5.4 0 12.1c0 6 4.4 11 10.1 11.9v-8.4H7.1v-3.5h3v-2.7c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-1.9.9-1.9 1.9v2.3h3.4l-.5 3.5h-2.9v8.4C19.6 23.1 24 18.1 24 12.1z"/></svg>
              <span>Facebook</span>
            </button>
          </div>
          <div class="auth-divider"><span>or with email</span></div>
        </div>

        <form data-demo>
          <div class="field">
            <label>Email address</label>
            <input type="email" required placeholder="you@example.com">
          </div>
          <div class="field">
            <label>Password</label>
            <div class="passwordbox">
              <input type="password" required minlength="6" placeholder="Enter password">
              <button type="button" class="eye" aria-label="Show password">◉</button>
            </div>
          </div>
          <div class="formrow">
            <label><input type="checkbox"> Remember me</label>
            <a class="textlink" href="forgot-password.html">Forgot password?</a>
          </div>
          <button class="btn">Sign in →</button>
          <div class="notice"></div>
        </form>
        <div class="auth-footer-note">New to Lustre Lane? <a class="textlink" href="signup.html">Create an account</a></div>
      </div>
    </div>
  </div>
</body>
</html>
